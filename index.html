<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>여의도여고 3D 실내지도</title>
<style>
:root{--g:#03C75A;--gd:#02a94c;--gl:#e8f8ef;--bg:#EBEFEF;--line:#e3e8ea;--text:#232b2f;--sub:#7b878d;--red:#ff3b4e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Pretendard,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;color:var(--text);background:var(--bg)}
button,select,input{font:inherit;color:inherit}
.app{position:fixed;inset:0}
.map{position:absolute;inset:0;overflow:hidden;background:var(--bg);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.panel{position:absolute;top:16px;left:16px;width:360px;max-height:calc(100% - 32px);background:#fff;border-radius:14px;box-shadow:0 4px 22px rgba(0,0,0,.18);z-index:20;display:flex;flex-direction:column;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.brand-ico{width:34px;height:34px;border-radius:10px;background:var(--g);display:grid;place-items:center;flex:none}
.brand-ico svg{width:20px;height:20px}
.brand b{display:block;font-size:17px;letter-spacing:-.3px;color:var(--gd)}
.brand span{font-size:12px;color:var(--sub)}
.handle{display:none;margin-left:auto;border:0;background:#f1f4f5;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:16px}
.panel-body{overflow:auto;padding:0 18px 16px}
.routebox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative}
.row{display:flex;align-items:center;gap:10px;padding:5px 0}
.row+.row{border-top:1px dashed var(--line)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:3px solid;background:#fff}
.dot.s{border-color:var(--g)}.dot.e{border-color:var(--red)}
.row select{flex:1;min-width:0;border:0;background:transparent;padding:8px 4px;font-size:14px;font-weight:600;outline:none;cursor:pointer;text-overflow:ellipsis}
.swap{position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;box-shadow:0 1px 5px #0002;cursor:pointer;font-size:14px;line-height:1}
.opts{display:flex;align-items:center;gap:8px;margin:10px 2px 0;font-size:12px;color:var(--sub)}
.opts select{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px;background:#fff;color:var(--text)}
.go{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 2px 8px rgba(3,199,90,.35)}
.go:hover{background:var(--gd)}
.go:active{transform:translateY(1px)}
.result{display:none;margin-top:12px;border-radius:12px;background:#f3fbf6;border:1px solid #d3f0df;padding:14px}
.result.err{background:#fff4f5;border-color:#ffd6da;color:#c42b3b;font-size:13px;line-height:1.6}
.sum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sum .min{font-size:26px;font-weight:850;color:var(--red);letter-spacing:-.5px}
.sum .min small{font-size:14px;font-weight:700}
.sum .meta{font-size:13px;color:#52606a}
.chips{display:flex;gap:6px;margin:8px 0 2px;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;background:#fff;border:1px solid #cfe9db;color:#2a7a52;font-weight:700}
.steps{list-style:none;margin:10px 0 0;padding:0}
.steps li{display:flex;gap:10px;padding:8px 0;font-size:13px;line-height:1.45;cursor:pointer;border-top:1px solid #e2f1e8}
.steps li:first-child{border-top:0}
.steps .fl{flex:none;min-width:34px;height:22px;border-radius:6px;background:var(--g);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.steps li.v .fl{background:#ff8a3d}
.steps li:hover{background:#ebf8f0}
.secttl{margin:16px 0 6px;font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.secttl span{font-weight:600;color:var(--sub);font-size:12px}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
.plist li{display:flex;align-items:center;gap:7px;padding:6px 6px;border-radius:8px;font-size:13px;cursor:pointer;min-width:0}
.plist li:hover{background:var(--gl)}
.plist .no{flex:none;width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.plist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .grp{grid-column:1/-1;font-size:12px;font-weight:800;color:#03a94c;cursor:default;padding:8px 4px 2px}
.plist .grp:hover{background:none}
.hint{margin:12px 2px 0;font-size:11.5px;color:#8a979d;line-height:1.55}
.badge{position:absolute;right:16px;top:16px;background:#fff;padding:9px 13px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:12px;font-weight:700;color:#4a565c;z-index:10}
.badge b{color:var(--g)}
.floors{position:absolute;right:16px;top:64px;display:flex;flex-direction:column;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.18);overflow:hidden;z-index:10}
.floors button{position:relative;width:46px;height:42px;border:0;background:#fff;font-weight:800;font-size:14px;color:#56636a;cursor:pointer;border-top:1px solid var(--line)}
.floors button:first-child{border-top:0}
.floors button:hover{background:var(--gl)}
.floors button.on{background:var(--g);color:#fff}
.floors button.has::after{content:"";position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff}
.tools{position:absolute;right:16px;bottom:22px;display:grid;gap:8px;z-index:10}
.tools button{width:44px;height:44px;border:0;border-radius:12px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:22px;cursor:pointer;line-height:1}
.tools button:hover{background:var(--gl)}
.info{position:absolute;z-index:15;width:236px;background:#fff;border-radius:12px;padding:14px 14px 12px;box-shadow:0 6px 26px rgba(0,0,0,.28);display:none;transform:translate(-50%,-100%)}
.info::after{content:"";position:absolute;left:50%;bottom:-8px;width:16px;height:16px;background:#fff;transform:translateX(-50%) rotate(45deg);box-shadow:3px 3px 6px rgba(0,0,0,.12)}
.info h3{margin:0 24px 4px 0;font-size:16px;letter-spacing:-.3px}
.info .loc{font-size:11.5px;color:var(--g);font-weight:800;margin-bottom:4px}
.info p{margin:0 0 10px;font-size:12.5px;color:#5f6c73;line-height:1.5}
.info .btns{display:flex;gap:6px}
.info .btns button{flex:1;border:0;border-radius:8px;padding:9px 0;font-size:13px;font-weight:800;cursor:pointer}
.info .bs{background:var(--gl);color:var(--gd)}.info .be{background:#ffecee;color:#d02a3c}
.info .x{position:absolute;right:8px;top:8px;border:0;background:none;font-size:18px;color:#9aa6ab;cursor:pointer;width:26px;height:26px;line-height:1}
.info.below{transform:translate(-50%,0)}
.info.below::after{bottom:auto;top:-8px;box-shadow:-3px -3px 6px rgba(0,0,0,.08)}
.tour{width:100%;margin:8px 0 2px;padding:10px;border:0;border-radius:9px;background:#ff3b4e;color:#fff;font-weight:800;font-size:13.5px;cursor:pointer}
@media(max-width:760px){
 .panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:52vh;border-radius:18px 18px 0 0}
 .handle{display:block}
 .panel.min .panel-body{display:none}
 .panel-head{padding:12px 16px 8px}
 .panel-body{padding:0 14px 14px}
 .badge{display:none}
 .floors{top:12px}.floors button{height:34px;width:42px;font-size:13px}
 .tools{bottom:calc(var(--sheet,230px) + 14px)}
 .tools button{width:40px;height:40px}.tools #plus,.tools #minus{display:none}
}
</style>
</head>
<body>
<div class="app">
 <main class="map" id="map">
  <div class="badge">🗺️ <b>여의도여고</b> 실내지도 · <span id="curFloorTxt">1층</span></div>
  <div class="floors" id="floors"></div>
  <div class="info" id="info">
   <button class="x" id="infoX" aria-label="닫기">×</button>
   <div class="loc" id="infoLoc"></div><h3 id="infoTitle"></h3><p id="infoDesc"></p>
   <div class="btns" id="infoBtns"><button class="bs" id="setStart">출발지로</button><button class="be" id="setEnd">도착지로</button></div>
  </div>
  <div class="tools"><button id="plus" title="확대">+</button><button id="minus" title="축소">−</button><button id="topv" title="평면/입체 전환" style="font-size:13px;font-weight:800">2D</button><button id="reset" title="중심 재설정">🎯</button></div>
 </main>
 <aside class="panel" id="panel">
  <div class="panel-head">
   <div class="brand-ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
   <div class="brand"><b>여의도여고 캠퍼스맵</b><span>3D 층별 실내지도 · 계단 길찾기</span></div>
   <button class="handle" id="handle" aria-label="패널 접기/펼치기">▾</button>
  </div>
  <div class="panel-body" id="panelBody">
   <div class="routebox">
    <div class="row"><span class="dot s"></span><select id="start" aria-label="출발지"></select></div>
    <div class="row"><span class="dot e"></span><select id="end" aria-label="도착지"></select></div>
    <button class="swap" id="swap" title="출발/도착 바꾸기">⇅</button>
   </div>
   <div class="opts"><span>이동 수단</span>
    <select id="mode"><option value="any">최단 시간 (계단+엘레베이터)</option><option value="stairs">계단만 이용</option><option value="elev">엘레베이터만 이용</option></select>
   </div>
   <div class="opts"><span>층 간격</span><input type="range" id="gap" min="30" max="120" value="46" style="flex:1;accent-color:#03C75A"></div>
   <button class="go" id="go">⌁ 최단 경로 탐색</button>
   <div class="result" id="result"></div>
   <div class="secttl">📍 <span id="listTtl" style="flex:1;margin-left:4px;color:var(--text);font-weight:800"></span><span id="listCnt"></span></div>
   <ul class="plist" id="plist"></ul>
   <p class="hint">지도 위 번호(핀)나 교실을 누르면 정보창이 열려요.<br>드래그로 회전 · Shift/우클릭 드래그로 이동 · 휠/핀치로 확대·축소<br>✨ 자판기와 분리수거장에 숨은 이스터에그가 있어요!</p>
  </div>
 </aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const VBW=667, VBH=943;
const FLOORS=[1,2,3,4,5];
const SCALE_M=0.22, WALK=1.25;

const POIS=[];
let B='본관';
const DESC={
 '교장실':'교장실','행정실':'학교 행정 업무 공간','방송실':'방송 시설 공간','중앙현관':'본관 중앙 출입구',
 'Wee클래스':'학생 상담·정서 지원 공간','생명과학실':'과학 실험 수업 공간','과학준비실':'과학 실험 준비 공간',
 '물리학실':'물리 실험 수업 공간','수리과학부':'교사 업무 공간','상담실':'상담 공간','생활안전체육부':'교사 업무 공간',
 '입구':'본관 서측 출입구','교문':'학교 정문','체육관':'체육 활동 공간','음악실①':'음악 수업 공간','음악실②':'음악 수업 공간',
 '메이커스페이스':'메이커 활동 공간','체육준비실':'체육 용품 준비 공간','무용실':'무용 수업 공간','인쇄실':'인쇄 공간',
 '대회의실':'회의 공간','성적처리실':'성적 처리 업무 공간','1학년교무실':'1학년 교사 업무 공간','휴게실':'휴게 공간',
 '1교무실':'교사 업무 공간','3학년부':'교사 업무 공간','보건실':'학생 건강 관리·응급처치','인문사회부':'교사 업무 공간',
 '창의체험예술부':'교사 업무 공간','홈베이스락':'학생 공용 공간','교직원식당':'교직원 식사 공간','전환교육실':'특별 교육 공간',
 '학생식당':'급식·식사 공간','미술실':'미술 수업 공간','교육정보부':'교사 업무 공간','2학년부':'교사 업무 공간',
 '자습실':'학생 자율학습 공간','도서관':'도서 열람·대출 공간','컴퓨터실':'컴퓨터 실습 공간','진로진학부':'진로·진학 업무 공간',
 '자판기':'음료·간식 자판기',
 '단아가운영하는자판기':'✨ 숨겨진 이스터에그! 눌러보세요',
 '분리수거장서우':'✨ 숨겨진 이스터에그! 눌러보세요'
};
function descOf(n){
  let m=/^(\d)-(\d)$/.exec(n); if(m) return `${m[1]}학년 ${m[2]}반 교실`;
  if(/교과실$/.test(n)) return '교과 교실';
  return DESC[n]||'';
}
function add(f,l,cat,sh,c,d){
  const n=l.replace(/\|/g,'');
  POIS.push({f,l,n,cat,sh,c,b:B,d:d||descOf(n)});
}
const Rm=(f,l,cat,x1,y1,x2,y2,c)=>add(f,l,cat,{t:'r',x:x1,y:y1,w:x2-x1,h:y2-y1},c||[(x1+x2)/2,(y1+y2)/2]);
const Pg=(f,l,cat,pts,c)=>add(f,l,cat,{t:'p',pts},c);
const Rt=(f,l,cat,cx,cy,w,h,a)=>add(f,l,cat,{t:'t',cx,cy,w,h,a},[cx,cy]);

const GROUPS={
  SWN:{n:'서측 계단(북)',t:'stair'}, SWS:{n:'서측 계단(남)',t:'stair'},
  EL :{n:'서측 엘레베이터',t:'elev'}, EL2:{n:'본관 엘레베이터',t:'elev'}, GY:{n:'체육관 계단',t:'stair'}, GR :{n:'구름계단·구름다리',t:'stair'},
  MS :{n:'본관 계단',t:'stair'}, IW :{n:'정보관 계단(서)',t:'stair'},
  IE :{n:'정보관 계단(동)',t:'stair'}
};
function Cn(g,f,x1,y1,x2,y2,bld){
  const gi=GROUPS[g];
  POIS.push({f,l:gi.n,n:gi.n,cat:'conn',g,t:gi.t,sh:{t:'r',x:x1,y:y1,w:x2-x1,h:y2-y1},c:[(x1+x2)/2,(y1+y2)/2],b:bld||B,
             d:(gi.t==='elev'?'엘레베이터 · 층간 이동':'계단 · 층간 이동')});
}

/* ===== 1층 ===== */
B='체육관';
Rm(1,'체육관','special',428,168,608,377,[520,335]);
Rm(1,'음악실①','special',428,170,490,196);
Rm(1,'음악실②','special',560,170,607,216);
Rm(1,'메이커|스페이스','special',428,255,490,292);
Rm(1,'체육|준비실','special',428,297,490,320);
Rm(1,'무용실','special',558,258,607,285);
Cn('GY',1,548,312,607,348);
B='본관';
Rm(1,'교장실','office',30,340,79,363);
Rm(1,'행정실','office',30,364,80,387);
Rm(1,'방송실','special',217,340,256,361);
Rm(1,'중앙현관','special',110,415,186,437);
Rm(1,'Wee|클래스','special',298,410,358,437);
Rm(1,'생명|과학실','special',100,512,153,566);
Rm(1,'과학|준비실','special',100,581,153,621);
Rm(1,'물리학실','special',100,629,153,651);
Rm(1,'수리|과학부','office',110,778,153,802);
Rm(1,'상담실','special',110,808,153,829);
Rm(1,'생활안전|체육부','office',110,834,153,883);
Rm(1,'입구','special',62,888,123,918);
B='교문';
Rm(1,'교문','gate',152,890,212,943);
B='본관';
Cn('MS',1,80,342,128,375);
Cn('EL2',1,128,342,170,362);
Cn('GR',1,30,437,55,510);
Cn('SWN',1,30,512,68,542);
Cn('EL',1,30,588,68,622);
Cn('SWS',1,30,842,65,862);
/* 자판기 · 분리수거장서우(이스터에그) */
Rm(1,'자판기','vend',32,562,50,582);
Rm(1,'분리수거장|서우','egg',4,628,24,730);

/* ===== 2층 ===== */
Rm(2,'인쇄실','office',30,342,78,365);
Rm(2,'대회의실','special',78,342,143,365);
Rm(2,'성적|처리실','office',57,417,106,437);
Rm(2,'1학년|교무실','office',165,413,233,437);
Rm(2,'휴게실','special',283,410,320,437);
Rm(2,'1교무실','office',322,378,372,401);
Rm(2,'3학년부','office',110,515,153,538);
Rm(2,'보건실','special',110,573,153,600);

Rm(2,'홈베이스|락','special',108,787,153,820);
Rm(2,'교직원|식당','special',65,897,128,920);
Rm(2,'자판기','vend',32,560,50,578);
Cn('GR',2,30,437,55,510);
Cn('MS',2,190,343,225,368);
Cn('EL2',2,235,345,282,362);
Cn('EL',2,30,575,85,600);
Cn('SWS',2,30,873,60,890);

/* ===== 3층 ===== */
Rm(3,'1-4','class',30,397,105,437);
Rm(3,'1-3','class',105,397,167,437);
Rm(3,'1-2','class',167,397,235,437);
Rm(3,'1-1','class',235,397,297,437);
Rm(3,'6교과실','class',297,397,374,437);
Rm(3,'1-5','class',92,510,153,578);
Rm(3,'1-6','class',92,578,153,641);
Rm(3,'10교과실','class',92,641,153,709);
Rm(3,'전환|교육실','special',92,709,153,786);
Rm(3,'11교과실','class',92,786,153,858);

function addNode(f,x,y,poi){

function link(a,b,px,kind,w,out){
  if(a===b) return;
  w=w!==undefined?w:px*SCALE_M/WALK;
  ADJ[a].push({to:b,w,px,kind,out}); ADJ[b].push({to:a,w,px,kind,out});
}
function projectOnSeg(p,a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy;

  const x=a[0]+dx*t,y=a[1]+dy*t;
  return {t,x,y,d:Math.hypot(p[0]-x,p[1]-y)};
}

function dijkstra(s,t,mode){
  const n=NODES.length,dist=new Array(n).fill(Infinity),prev=new Array(n).fill(-1),done=new Array(n).fill(false);
  dist[s]=0;
  const heap=[[0,s]];                       // 우선순위 큐(최소 힙)
  const hpush=x=>{let i=heap.push(x)-1;while(i>0){const p=(i-1)>>1;if(heap[p][0]<=heap[i][0])break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p;}};
  const hpop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m;}}return top;};
  while(heap.length){
    const u=hpop()[1];
    if(done[u]) continue;
    if(u===t) break;
    done[u]=true;
    for(const e of ADJ[u]){
      if(mode==='stairs'&&e.kind==='elev') continue;
      if(mode==='elev'&&e.kind==='stair') continue;
      const nd=NODES[e.to];
      if(nd.poi!==undefined && e.to!==t && POIS[nd.poi].cat!=='conn') continue;
      const alt=dist[u]+e.w;
      if(alt<dist[e.to]){dist[e.to]=alt;prev[e.to]=u;hpush([alt,e.to]);}
    }
  }
  if(dist[t]===Infinity) return null;
  const path=[t]; let u=t; while(u!==s){u=prev[u];path.unshift(u);}
  return {path,sec:dist[t]};
}
function buildRoute(path,mode){
  const segs=[],steps=[];
  const nm=i=>POIS[NODES[i].poi].n;
  let cur={f:NODES[path[0]].f,pts:[[NODES[path[0]].x,NODES[path[0]].y]],px:0,from:nm(path[0])};
  let meters=0,stairsN=0,elevN=0,lastV=null,outPx=0;
  const flush=(toName)=>{
    cur.to=toName; segs.push(cur);
    const m=Math.round(cur.px*SCALE_M); meters+=m;
    steps.push({f:cur.f,txt:`${cur.f}층 · ${cur.from} → ${toName}`,sub:`약 ${m}m`,seg:segs.length-1});
  };
  for(let i=0;i<path.length-1;i++){
    const a=path[i],b=path[i+1],nb=NODES[b];
    const e=ADJ[a].filter(x=>x.to===b&&!(mode==='stairs'&&x.kind==='elev')&&!(mode==='elev'&&x.kind==='stair')).sort((p,q)=>p.w-q.w)[0];
    if(e.kind==='walk'){cur.pts.push([nb.x,nb.y]);cur.px+=e.px;if(e.out)outPx+=e.px;continue;}
    const df=Math.abs(nb.f-NODES[a].f);
    if(e.kind==='elev') elevN+=df; else stairsN+=df;
    const kindTxt=e.kind==='elev'?'엘레베이터':'계단';
    if(cur.pts.length===1&&lastV&&lastV.kind===e.kind&&lastV.g===POIS[NODES[a].poi].g){
      lastV.to=nb.f; lastV.f=nb.f;
      lastV.txt=`${lastV.name} 이용 · ${lastV.from}층 → ${nb.f}층 이동`;
      lastV.x=nb.x; lastV.y=nb.y;
    }else{
      flush(nm(a));
      const pa=POIS[NODES[a].poi];
      lastV={v:1,kind:e.kind,g:pa.g,name:pa.n,from:NODES[a].f,to:nb.f,f:nb.f,txt:`${pa.n} 이용 · ${NODES[a].f}층 → ${nb.f}층 이동`,sub:kindTxt,x:nb.x,y:nb.y};
      steps.push(lastV);
    }
    cur={f:nb.f,pts:[[nb.x,nb.y]],px:0,from:nm(b)};
  }
  flush(nm(path[path.length-1]));
  return {segs,steps,meters,stairsN,elevN,outM:Math.round(outPx*SCALE_M)};
}

Object.keys(CANON).forEach(g=>{const G=GFLOORS[g];if(!G)return;for(let f=G.min;f<G.max;f++)buildStairPair(g,f);});

let mode='all';
function setMats(f,d){

}
function applyMode(){
  FLOORS.forEach(f=>{
    const F=floors[f];let vis=true,dim=1;
    if(mode!=='all'){ if(f>mode) vis=false; else if(f<mode) dim=.12; }
    F.g.visible=vis;setMats(f,dim);F.dim=dim;
    const showL=vis&&(mode!=='all'?f===mode:cam.r<430);
    F.labels.forEach(l=>l.visible=showL);
    F.pins.forEach(p=>p.visible=vis&&(mode!=='all'?f===mode:false));
    F.tag.visible=vis&&(mode==='all'||f===mode);
  });
  stairPairs.forEach(sp=>{const a=floors[sp.f],b=floors[sp.f+1];sp.G.visible=a.g.visible&&b.g.visible;});

}

const cam={th:.62,ph:.9,r:1500,tx:0,ty:60,tz:0};
let tgtC={...cam};
function camUpdate(k){
  ['th','ph','r','tx','ty','tz'].forEach(a=>{cam[a]+=(tgtC[a]-cam[a])*k;});
  const sp=Math.sin(cam.ph),x=cam.tx+cam.r*sp*Math.sin(cam.th),y=cam.ty+cam.r*Math.cos(cam.ph),z=cam.tz+cam.r*sp*Math.cos(cam.th);
  camera.position.set(x,y,z);camera.lookAt(cam.tx,cam.ty,cam.tz);
}
function viewOffset(){
  const W=mapEl.clientWidth,H=mapEl.clientHeight;
  let ox=0,oy=0;

function resize(){

addEventListener('resize',resize);
const midY=()=>((FLOORS.length-1)*S)/2+10;
function homeView(top){

const ptr=new Map();let moved=0,pinch=null,downAt=null,touring=false;
mapEl.addEventListener('pointerdown',e=>{
  if(e.target.closest('.floors,.tools,.info,.badge'))return;
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button,sh:e.shiftKey});moved=0;downAt={x:e.clientX,y:e.clientY};
  if(ptr.size===2){const [a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),r:tgtC.r};}
  stopTour();
});
addEventListener('pointermove',e=>{
  const p=ptr.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;moved+=Math.abs(dx)+Math.abs(dy);

    else{tgtC.th-=dx*.0065;tgtC.ph=Math.max(.001,Math.min(1.55,tgtC.ph-dy*.0055));}
  }else if(ptr.size===2&&pinch){
    p.x=e.clientX;p.y=e.clientY;const [a,b]=[...ptr.values()];

function panBy(dx,dy){

  const rx=Math.cos(th),rz=-Math.sin(th);
  const fx=-Math.sin(th),fz=-Math.cos(th);
  tgtC.tx-=(rx*dx-fx*dy*(tgtC.ph<.5?1:1.3))*k;tgtC.tz-=(rz*dx-fz*dy*(tgtC.ph<.5?1:1.3))*k;
}
function endPtr(e){
  const had=ptr.has(e.pointerId);ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;

}

mapEl.addEventListener('wheel',e=>{e.preventDefault();stopTour();tgtC.r=Math.max(120,Math.min(2600,tgtC.r*Math.exp(e.deltaY*.0013)));},{passive:false});
mapEl.addEventListener('contextmenu',e=>e.preventDefault());
$('plus').onclick=()=>{tgtC.r=Math.max(120,tgtC.r/1.3);};

let topMode=false;
$('topv').onclick=()=>{stopTour();topMode=!topMode;homeView(topMode);$('topv').textContent=topMode?'3D':'2D';};
$('gap').oninput=e=>{S=+e.target.value;relayout();};
function relayout(){

let selStart='',selEnd='',infoPoi=null,route=null;
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function pick(e){
  const r=cv.getBoundingClientRect();
  mv.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mv,camera);
  const list=[];
  FLOORS.forEach(f=>{const F=floors[f];if(!F.g.visible)return;F.pick.forEach(m=>{if(m.parent&&m.parent.visible)list.push(m);});});
  const hit=ray.intersectObjects(list,false)[0];
  if(hit&&hit.object.userData.i!==undefined)openInfo(hit.object.userData.i);
  else closeInfo();
}
function openInfo(i,fly){

  if(p.cat==='conn'){const G=GFLOORS[p.g];d+=G.min===G.max?' — 도면에 이 층에만 표시':` — ${G.min}층 ~ ${G.max}층 연결`;}
  $('infoDesc').textContent=d;$('infoBtns').style.display=p.cat==='conn'?'none':'flex';
  info.style.display='block';

    if(mode!=='all'&&p.f!==mode)setMode(p.f);
    const y=(p.f-1)*S+RH;tgtC={...tgtC,tx:X(p.c[0]),ty:y,tz:Z(p.c[1]),r:Math.min(tgtC.r,520)};
  }
  markSel();
}
function closeInfo(){infoPoi=null;info.style.display='none';markSel();}
$('infoX').onclick=closeInfo;
addEventListener('keydown',e=>{if(e.key==='Escape')closeInfo();});
$('setStart').onclick=()=>{selStart=String(infoPoi);startSel.value=selStart;closeInfo();syncEnds();};
$('setEnd').onclick=()=>{selEnd=String(infoPoi);endSel.value=selEnd;closeInfo();syncEnds();};
let endPins=[];
function syncEnds(){
  endPins.forEach(s=>s.parent&&s.parent.remove(s));endPins=[];
  [[selStart,'출','#03C75A'],[selEnd,'도','#ff3b4e']].forEach(([v,t,c])=>{
    if(v==='')return;const p=POIS[+v],pn=pinSprite(t,c);pn.userData.px=40;pn.position.set(X(p.c[0]),RH+1,Z(p.c[1]));floors[p.f].g.add(pn);endPins.push(pn);
  });

}
let hl=[];
function markSel(){
  hl.forEach(h=>h.parent&&h.parent.remove(h));hl=[];
  [infoPoi,selStart===''?null:+selStart,selEnd===''?null:+selEnd].forEach((i,k)=>{
    if(i===null||i===undefined)return;const p=POIS[i];if(p.cat==='conn')return;
    const s=p.sh;let geo;
    if(s.t==='r'){geo=new THREE.BoxGeometry(s.w+1.5,RH+1,s.h+1.5);geo.translate(X(s.x+s.w/2),(RH+1)/2,Z(s.y+s.h/2));}
    else if(s.t==='p'){geo=extrude(shapePoly(s.pts),RH+1,0);}
    else{geo=new THREE.BoxGeometry(s.w+1.5,RH+1,s.h+1.5);geo.rotateY(-s.a*Math.PI/180);geo.translate(X(s.cx),(RH+1)/2,Z(s.cy));}
    const col=k===0?0x2f6bff:k===1?0x03C75A:0xff3b4e;
    const m=new THREE.LineSegments(new THREE.EdgesGeometry(geo,25),new THREE.LineBasicMaterial({color:col,depthTest:false}));m.renderOrder=15;
    floors[p.f].g.add(m);hl.push(m);
  });
}
const _v=new THREE.Vector3();
function updateInfo(){
  if(infoPoi===null||info.style.display==='none')return;
  const p=POIS[infoPoi],F=floors[p.f];
  if(!F.g.visible){info.style.display='none';return;}
  info.style.display='block';
  _v.set(X(p.c[0]),(p.f-1)*S+(p.cat==='conn'?S0/2:RH+10),Z(p.c[1])).project(camera);
  const W=mapEl.clientWidth,H=mapEl.clientHeight,sx=(_v.x+1)/2*W,sy=(1-_v.y)/2*H,hh=info.offsetHeight||140;
  info.style.left=sx+'px';
  if(sy-hh-18<4){info.classList.add('below');info.style.top=(sy+16)+'px';}
  else{info.classList.remove('below');info.style.top=(sy-14)+'px';}
}

function setMode(m){
  mode=m;applyMode();
  tgtC.ty=m==='all'?midY():(m-1)*S+RH/2;
  if(m!=='all')tgtC.r=Math.max(tgtC.r,topMode?1250:1350);
  if(infoPoi!==null&&POIS[infoPoi].f>(m==='all'?9:m))closeInfo();
}
function renderFloorsBtn(){
  const el=$('floors');el.innerHTML='';
  const mk=(txt,m,title)=>{const b=document.createElement('button');b.textContent=txt;b.title=title;if(mode===m)b.className='on';
    if(m!=='all'&&route&&route.floors.has(m))b.classList.add('has');b.onclick=()=>{setMode(m);};el.appendChild(b);};
  mk('전체','all','모든 층 보기');
  [...FLOORS].reverse().forEach(f=>mk(f+'F',f,f+'층만 보기 (윗층 숨김)'));
  el.firstChild.style.fontSize='12px';
}
function renderList(){
  const lf=mode==='all'?null:mode;
  $('listTtl').textContent=lf?lf+'층 장소':'전체 층 장소';
  const ul=$('plist');ul.innerHTML='';let c=0;
  FLOORS.forEach(f=>{
    if(lf&&f!==lf)return;
    if(!lf){const h=document.createElement('li');h.className='grp';h.textContent=f+'층';ul.appendChild(h);}
    POIS.forEach((p,i)=>{
      if(p.f!==f||p.cat==='conn')return;c++;
      const li=document.createElement('li');li.innerHTML=`<span class="no">${NUM[i]}</span><span class="nm">${p.n}</span>`;
      li.onclick=()=>openInfo(i,true);ul.appendChild(li);
    });
  });
  $('listCnt').textContent=c+'곳';
}
function fillSelects(){
  [startSel,endSel].forEach((s,k)=>{
    s.innerHTML=`<option value="">${k?'도착지 선택':'출발지 선택'}</option>`;
    FLOORS.forEach(f=>{const g=document.createElement('optgroup');g.label=f+'층';
      POIS.forEach((p,i)=>{if(p.f===f&&p.cat!=='conn')g.appendChild(new Option(`${NUM[i]}. ${p.n}`,i));});s.appendChild(g);});
  });
}
startSel.onchange=()=>{selStart=startSel.value;syncEnds();};
endSel.onchange=()=>{selEnd=endSel.value;syncEnds();};
$('swap').onclick=()=>{const a=selStart;selStart=selEnd;selEnd=a;startSel.value=selStart;endSel.value=selEnd;syncEnds();};

function rampPts(g,lo,up){
  const cn=CANON[g],[x1,y1,x2,y2]=cn.r,pts=[];
  if(GROUPS[g].t==='elev'){
    const cx=(x1+x2)/2,cy=(y1+y2)/2;pts.push([cx,cy,0],[cx,cy,1]);
  }else{
    const L=stairLocal(g),a=L.p*.5,far=L.L-L.q*.5,vA=L.Wd*.25,vB=L.Wd*.75;
    const seq=[[a,vA,0],[L.L-L.q,vA,.5],[far,vA,.5],[far,vB,.5],[L.L-L.q,vB,.5],[a,vB,1]];
    seq.forEach(q=>{const w=L.toW(q[0],q[1]);pts.push([w[0],w[1],q[2]]);});
  }
  if(!up)pts.reverse().forEach(q=>q[2]=1-q[2]);
  return pts.map(q=>({x:q[0],y:q[1],f:lo,h:q[2]}));
}
function path3d(path){
  const out=[];const push=(x,y,f,h)=>out.push(new THREE.Vector3(X(x),(f-1)*S+(h||0)*S+3,Z(y)));
  const n0=NODES[path[0]];push(n0.x,n0.y,n0.f,0);
  for(let i=0;i<path.length-1;i++){
    const a=NODES[path[i]],b=NODES[path[i+1]];
    if(a.f===b.f){push(b.x,b.y,b.f,0);continue;}
    const g=POIS[a.poi].g,up=b.f>a.f;
    const fl=[];for(let f=a.f;f!==b.f;f+=up?1:-1)fl.push(up?f:f-1);
    fl.forEach(lo=>rampPts(g,lo,up).forEach(q=>push(q.x,q.y,lo,q.h)));
    push(b.x,b.y,b.f,0);
  }
  return out;
}
const stripe=(()=>{const c=document.createElement('canvas');c.width=64;c.height=8;const x=c.getContext('2d');
  x.clearRect(0,0,64,8);x.fillStyle='#ff3b4e';x.fillRect(0,0,40,8);x.fillStyle='#ffd0d6';x.fillRect(40,0,8,8);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;})();
let routeObj=null,runner=null,curve=null;
function drawRoute(){
  if(routeObj){scene.remove(routeObj);routeObj.traverse(o=>{o.geometry&&o.geometry.dispose();});routeObj=null;}
  if(!route)return;
  const pts=path3d(route.path),cp=new THREE.CurvePath();
  for(let i=0;i<pts.length-1;i++)if(pts[i].distanceTo(pts[i+1])>.01)cp.add(new THREE.LineCurve3(pts[i],pts[i+1]));
  curve=cp;const len=cp.getLength(),seg=Math.min(2500,Math.max(40,Math.ceil(len/2)));
  const g=new THREE.TubeGeometry(cp,seg,1.7,6,false);
  stripe.repeat.set(len/16,1);
  const main=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:stripe,transparent:true,depthTest:false,alphaTest:.3}));main.renderOrder=40;
  const glow=new THREE.Mesh(new THREE.TubeGeometry(cp,seg,3.6,6,false),new THREE.MeshBasicMaterial({color:0xff3b4e,transparent:true,opacity:.22,depthTest:false}));glow.renderOrder=39;
  routeObj=new THREE.Group();routeObj.add(glow,main);
  runner=new THREE.Mesh(new THREE.SphereGeometry(4.2,16,12),new THREE.MeshBasicMaterial({color:0xffffff,depthTest:false}));runner.renderOrder=41;
  const ring=new THREE.Mesh(new THREE.SphereGeometry(6.4,16,12),new THREE.MeshBasicMaterial({color:0xff3b4e,transparent:true,opacity:.45,depthTest:false}));ring.renderOrder=40;runner.add(ring);
  routeObj.add(runner);scene.add(routeObj);
}
function showMsg(t){const r=$('result');r.className='result err';r.style.display='block';r.textContent=t;}
$('go').onclick=()=>{
  stopTour();
  if(selStart===''||selEnd==='')return showMsg('출발지와 도착지를 모두 선택해 주세요.');
  const a=+selStart,b=+selEnd;
  if(a===b)return showMsg('출발지와 도착지가 같습니다.');
  const md=$('mode').value,res=dijkstra(POIS[a].node,POIS[b].node,md);
  if(!res){route=null;drawRoute();renderFloorsBtn();return showMsg(md==='any'?'연결된 경로를 찾을 수 없습니다.':'선택한 이동 수단만으로는 갈 수 없는 경로입니다. 이동 수단을 바꿔 보세요.');}
  const rt=buildRoute(res.path,md);rt.path=res.path;rt.s=a;rt.e=b;rt.sec=res.sec;
  rt.floors=new Set(rt.segs.map(s=>s.f));
  route=rt;
  const min=Math.max(1,Math.ceil(res.sec/60)),r=$('result');
  const chips=[`${POIS[a].f}층 → ${POIS[b].f}층`];
  if(rt.elevN)chips.push('엘레베이터 이용');if(rt.stairsN)chips.push(`계단 ${rt.stairsN}개 층`);if(!rt.elevN&&!rt.stairsN)chips.push('같은 층 이동');if(rt.outM>0)chips.push(`외부 통로 ${rt.outM}m`);
  r.className='result';r.style.display='block';
  r.innerHTML=`<div class="sum"><span class="min">${min}<small>분</small></span><span class="meta">총 약 ${rt.meters}m · 도보 예상</span></div>
   <div class="chips">${chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
   <button class="tour" id="tourBtn">▶ 3D로 경로 따라가기</button>
   <ol class="steps" style="padding:0">${rt.steps.map((s,i)=>`<li class="${s.v?'v':''}" data-i="${i}"><span class="fl">${s.v?(s.kind==='elev'?'EV':'계단'):s.f+'F'}</span><span>${s.txt}<br><small style="color:#7b878d">${s.sub}</small></span></li>`).join('')}</ol>
   <div style="font-size:11px;color:#8a979d;margin-top:8px">거리·시간은 도면 기준 추정치입니다.</div>`;
  $('tourBtn').onclick=()=>startTour();
  r.querySelectorAll('.steps li').forEach(li=>li.onclick=()=>{
    const s=rt.steps[+li.dataset.i];stopTour();
    if(s.seg!==undefined){const sg=rt.segs[s.seg];setMode('all');
      const mx=sg.pts.reduce((u,q)=>u+q[0],0)/sg.pts.length,my=sg.pts.reduce((u,q)=>u+q[1],0)/sg.pts.length;
      tgtC={...tgtC,tx:X(mx),ty:(sg.f-1)*S+RH,tz:Z(my),r:520};}
    else{setMode('all');tgtC={...tgtC,tx:X(s.x),ty:(s.f-1)*S+RH,tz:Z(s.y),r:360};}
  });
  closeInfo();drawRoute();setMode('all');renderFloorsBtn();fitRoute();
  if(innerWidth<=760)panel.classList.remove('min');
};
function fitRoute(){
  const b=new THREE.Box3();curve&&curve.curves.forEach(c=>{b.expandByPoint(c.v1);b.expandByPoint(c.v2);});
  if(b.isEmpty())return;const c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3());
  const ext=Math.max(s.x,s.z,s.y*1.3,120);
  tgtC={...tgtC,tx:c.x,ty:c.y,tz:c.z,r:Math.max(380,Math.min(1700,ext*2.2)),ph:Math.min(tgtC.ph,1.05)};
  if(topMode){topMode=false;$('topv').textContent='2D';}
}
let tourT=0,tourLen=0;
function startTour(){
  if(!curve)return;touring=true;tourT=0;tourLen=curve.getLength();setMode('all');
  tgtC.r=300;tgtC.ph=1.0;$('tourBtn')&&($('tourBtn').textContent='■ 따라가기 중지');
  $('tourBtn').onclick=()=>{stopTour();};
}
function stopTour(){
  if(!touring)return;touring=false;const b=$('tourBtn');
  if(b){b.textContent='▶ 3D로 경로 따라가기';b.onclick=()=>startTour();}
}

$('handle').onclick=()=>{panel.classList.toggle('min');$('handle').textContent=panel.classList.contains('min')?'▴':'▾';setTimeout(resize,60);};

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  stripe.offset.x-=dt*1.6;
  fxTick(now,dt);
  if(touring&&curve){
    tourT+=dt*70/tourLen;if(tourT>=1){tourT=1;stopTour();}
    const p=curve.getPointAt(tourT);runner.position.copy(p);
    tgtC.tx=p.x;tgtC.ty=p.y;tgtC.tz=p.z;
    const q=curve.getPointAt(Math.min(1,tourT+.02));
    const want=Math.atan2(p.x-q.x,p.z-q.z);
    let d=want-tgtC.th;d=Math.atan2(Math.sin(d),Math.cos(d));tgtC.th+=d*.03;
  }else if(runner&&curve){const p=curve.getPointAt((now/6000)%1);runner.position.copy(p);}
  FLOORS.forEach(f=>(floors[f].cabs||[]).forEach(c=>{c.position.y=(.5+.5*Math.sin(now/900+f))*(S0-11);}));
  camUpdate(touring?.1:.2);
  if(mode==='all'){const sl=cam.r<430;FLOORS.forEach(f=>{const F=floors[f],on=F.g.visible&&sl&&(!route||route.floors.has(f));F.labels.forEach(l=>l.visible=on);F.tag.visible=!sl;});}
  renderer.render(scene,camera);updateInfo();
  requestAnimationFrame(frame);
}
fillSelects();applyMode();resize();homeView(false);camUpdate(1);sizePins();
requestAnimationFrame(frame);
new ResizeObserver(resize).observe(mapEl);
</script>
